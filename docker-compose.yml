services:
  storvi:
    build:
      context: .
      dockerfile: Dockerfile
    image: storvi:local
    container_name: storvi
    restart: unless-stopped

    # Published on ALL host interfaces, so the app is reachable over Tailscale
    # (http://100.68.180.101:3000) as well as any LAN the host is joined to.
    # Storvi has no user accounts and its API drives a headless browser and
    # spends AI quota, so anyone who can route to this port has full control.
    # Restrict it with a Tailscale ACL or a host firewall rule, or switch back
    # to "127.0.0.1:3000:3000" to make it local-only.
    ports:
      - "0.0.0.0:3000:3000"

    environment:
      # The container must bind 0.0.0.0 to be reachable through the published
      # port. With the `ports` entry above open on all interfaces, this flag is
      # a deliberate choice to run unauthenticated and rely on the surrounding
      # network (Tailscale ACLs, host firewall) for access control — the
      # process itself enforces nothing. Setting API_TOKEN below is the
      # stronger option and is now fully usable: the web UI prompts for the
      # token and attaches it to every request.
      HOST: 0.0.0.0
      PORT: "3000"
      ALLOW_INSECURE_BIND: "1"
      DATA_PATH: /app/data
      DATABASE_URL: /app/storage/storvi.sqlite
      # Optional, but the deployment is authenticated only while it is set:
      # `docker compose up -d` with no API_TOKEN in the environment recreates
      # the container unauthenticated (the server logs a startup warning).
      # The web UI prompts for it on the first 401 and stores it per browser.
      API_TOKEN: ${API_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional but recommended: a local model for selector generation. Leaving
      # this unset disables local AI (Gemini is then used if its key is set).
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      # Hosted backend, useful where this stack's `ollama` service cannot run
      # (it needs an NVIDIA runtime). With a key set:
      #   AI_PROVIDER=mistral docker compose up -d --no-deps storvi
      # because the OLLAMA_URL default above would otherwise win auto-detection.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}

    volumes:
      # Your EPUB/PDF library. Read-write: exports are written back here.
      - ./data:/app/data
      # SQLite database, kept out of the image and out of the library folder.
      - storvi-db:/app/storage

    # Chromium needs more than the default 64MB of shared memory.
    shm_size: "1gb"

    # Puppeteer already launches with --no-sandbox; this restores the kernel
    # sandbox syscalls Chromium needs rather than running the container
    # privileged.
    security_opt:
      - seccomp:unconfined

    depends_on:
      - ollama

  # Local model server for selector generation. Opt-in on the Storvi side: the
  # parser is only ever invoked from the UI, so it cannot contend with other
  # GPU work (Jellyfin transcoding, in the reference deployment) unprompted.
  ollama:
    image: ollama/ollama:latest
    container_name: storvi-ollama
    restart: unless-stopped

    # No `ports:` on purpose. Publishing this would expose an unauthenticated
    # endpoint that can consume the GPU to the LAN and tailnet; only Storvi
    # needs it, over the compose network.
    environment:
      # With ~4.7 GB of weights on an 8 GB card these two are what make a usable
      # context window fit.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # The GPU is shared, so the model unloads when idle: the next request pays
      # a reload. Raise to 30m on a dedicated card to avoid that latency.
      OLLAMA_KEEP_ALIVE: 5m

    volumes:
      # Model store. On TrueNAS bind-mount a ZFS dataset here (~5 GB for the
      # 7B model) instead of using this named volume; see README.
      - ollama-models:/root/.ollama

    # GPU access. Plain Docker honours the reservation; some TrueNAS versions
    # only look at `runtime`, so both are set to stay portable. Neither grants
    # the storvi service any GPU access.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  storvi-db:
  ollama-models:
